<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19191c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Map Extractor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet pro tool, like a scanner bench: precise, few words
   IDEA: a material scanning bench — one photo in, four plates out
   PICTURE: the live viewport (lit 3D sample or tiled 2D plate) fills the right side
   COLOUR and TYPE: graphite + paper; accent is the flat "up" colour of a normal map; IBM Plex Sans
   LAYOUT: rail + control panel left, viewport + map strip right; stacks under 820px */
:root{color-scheme:light dark;
--bg:light-dark(#e7e6e1,#111113);--panel:light-dark(#f6f5f1,#19191c);--panel2:light-dark(#ebeae4,#232327);
--line:light-dark(#d2d0c8,#2c2c31);--ink:light-dark(#19191c,#ecebe6);--mute:light-dark(#62626a,#9c9ca4);
--acc:light-dark(#4650d8,#8f95ff);--accInk:light-dark(#fff,#0c0c1a);--vp:#0e0e10}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-rows:56px minmax(0,1fr);height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;white-space:nowrap}
.brand b{font-weight:600;font-size:16px}.brand span{color:var(--mute)}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn:disabled{opacity:.5;cursor:wait}
.main{display:grid;grid-template-columns:84px 304px minmax(0,1fr);min-height:0}
.rail{display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.rail button{display:grid;place-items:center;gap:3px;height:58px;border:0;border-radius:8px;background:none;color:var(--mute);font-size:13px;padding:6px 2px}
.rail button svg{width:22px;height:22px}
.rail button:hover{color:var(--ink)}
.rail button[aria-selected=true]{background:var(--panel2);color:var(--ink)}
.panel{overflow:auto;padding:18px 16px 28px;border-right:1px solid var(--line);background:var(--panel)}
.panel h2{font-size:20px;line-height:1.1;margin:0 0 6px;font-weight:600}
.panel p.hint{margin:0 0 16px;color:var(--mute);font-size:13px}
.panel h3{font-size:13px;font-weight:600;margin:20px 0 8px;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;margin:0 0 6px}
.row label{cursor:default;user-select:none}
.row output{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
.row input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
.tg{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;user-select:none}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg span{flex:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s}
.tg span::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
.tg input:checked+span{background:var(--acc)}.tg input:checked+span::after{transform:translateX(14px)}
.tg input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:flex;padding:3px;gap:3px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);margin:0 0 10px}
.seg button{flex:1;height:32px;border:0;border-radius:6px;background:none;color:var(--mute);font-weight:500;white-space:nowrap;padding:0 8px}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px #0003}
.field{display:grid;gap:4px;margin:0 0 12px}
.field>span{color:var(--mute);font-size:13px}
select,input[type=text]{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;font-size:16px;width:100%}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.note{font-size:13px;color:var(--mute);margin:12px 0 0}
.eq{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:150px;padding:8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);touch-action:none;cursor:ns-resize}
.eqc{position:relative;border-radius:4px;background:color-mix(in srgb,var(--line) 55%,transparent);overflow:hidden}
.eqb{position:absolute;inset:auto 0 0 0;background:var(--acc);border-radius:4px 4px 0 0}
.eql{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:4px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chips button{height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line);background:none;font-size:13px}
.chips button:hover{border-color:var(--mute)}
.checks{display:grid;gap:2px;margin:0 0 12px}
.checks label{display:flex;align-items:center;gap:10px;min-height:40px}
.checks input{width:18px;height:18px;accent-color:var(--acc)}
.checks .btn{margin-left:auto;height:30px;padding:0 10px;font-size:13px}
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;background:var(--vp)}
.vp{position:relative;overflow:hidden;touch-action:none;cursor:grab;color:#e9e8e3}
.vp:active{cursor:grabbing}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vt{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;max-width:calc(100% - 24px)}
.vt .seg{margin:0;background:#1d1d21e6;border-color:#34343a;backdrop-filter:blur(8px)}
.vt .seg button{color:#9d9da5;height:30px}
.vt .seg button[aria-pressed=true]{background:#3a3a42;color:#fff}
.box3{display:grid;gap:0;padding:6px 12px 8px;border-radius:9px;background:#1d1d21e6;border:1px solid #34343a;width:200px;backdrop-filter:blur(8px)}
.box3 summary{cursor:pointer;color:#c9c9cf;font-size:13px;min-height:30px;display:flex;align-items:center;list-style:none}.box3 summary::-webkit-details-marker{display:none}.box3 summary::after{content:"";margin-left:auto;width:7px;height:7px;border:solid #9d9da5;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translateY(-2px)}.box3[open] summary::after{transform:rotate(-135deg)}.box3:not([open]){width:auto;padding:0 12px}.box3 .row{margin:0}.box3 output{color:#9d9da5}
.box3 input[type=range]::-webkit-slider-runnable-track{background:#3a3a42}.box3 input[type=range]::-webkit-slider-thumb{background:#fff}
.box3 input[type=range]::-moz-range-track{background:#3a3a42}.box3 input[type=range]::-moz-range-thumb{background:#fff}
.box3 .tg span{background:#3a3a42}
.hud{position:absolute;left:12px;bottom:10px;font-size:13px;color:#8e8e96;font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 1px 2px #000}
.busy{position:absolute;inset:0;display:none;place-items:center;background:#0e0e10cc;font-size:15px;z-index:5}
.busy.on{display:grid}
.crop{position:absolute;inset:0;display:none;place-items:center;background:var(--vp);z-index:3}
.crop.on{display:grid}
.cw{position:relative;overflow:hidden;box-shadow:0 10px 40px #0008}
.cw img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.cb{position:absolute;box-shadow:0 0 0 9999px #0e0e10b3;outline:1px solid #fff;cursor:move;touch-action:none;
background:linear-gradient(#fff3,#fff3) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff3,#fff3) 66.66% 0/1px 100% no-repeat,linear-gradient(#fff3,#fff3) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff3,#fff3) 0 66.66%/100% 1px no-repeat}
.cb i{position:absolute;width:28px;height:28px;margin:-14px;display:grid;place-items:center}
.cb i::after{content:"";width:12px;height:12px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #0006}
.cb i[data-h=nw]{left:0;top:0;cursor:nwse-resize}.cb i[data-h=ne]{right:0;top:0;cursor:nesw-resize}
.cb i[data-h=sw]{left:0;bottom:0;cursor:nesw-resize}.cb i[data-h=se]{right:0;bottom:0;cursor:nwse-resize}
.clab{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:13px;color:#c9c9cf;background:#1d1d21e6;padding:5px 10px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
.strip button{flex:none;display:grid;grid-template-columns:52px auto;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);text-align:left}
.strip canvas{width:52px;height:52px;border-radius:6px;display:block;background:#222}
.strip b{display:block;font-weight:500}.strip small{color:var(--mute);font-size:13px}
.strip button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.drop{position:fixed;inset:10px;border:2px dashed var(--acc);border-radius:16px;background:color-mix(in srgb,var(--bg) 80%,transparent);display:none;place-items:center;font-size:20px;font-weight:500;z-index:20;pointer-events:none}
.drop.on{display:grid}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;transition:.2s;z-index:30;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;display:none;place-items:end center;background:#0008;z-index:40;padding:16px}.sheet.on{display:grid}.shc{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.shc b{font-size:17px}.shc p{color:var(--mute);margin:4px 0 14px;font-size:14px}.shb{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#ddd}
@media (max-width:1100px){.main{grid-template-columns:76px 272px minmax(0,1fr)}}
@media (max-width:820px){
 body{overflow:auto}.app{height:auto;grid-template-rows:auto auto}
 header{flex-wrap:wrap;padding:10px 12px;gap:8px}.brand span{display:none}
 .main{grid-template-columns:minmax(0,1fr)}
 .stage{order:-1;height:64vh;min-height:380px}
 .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
 .rail button{flex:none;width:72px}
 .panel{border-right:0;overflow:visible}
 .strip button{grid-template-columns:44px auto}.strip canvas{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand">
  <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="2" fill="#b59b7c"/><rect x="15" y="1" width="12" height="12" rx="2" fill="url(#hg)"/><rect x="1" y="15" width="12" height="12" rx="2" fill="#8080ff"/><rect x="15" y="15" width="12" height="12" rx="2" fill="#a3a3a8"/><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eee"/><stop offset="1" stop-color="#333"/></linearGradient></defs></svg>
  <b>Map Extractor</b><span>BToolz · photo to PBR maps</span>
 </div>
 <input type="file" id="file" accept="image/*" hidden>
 <button class="btn" id="bOpen">Open image</button>
 <button class="btn" id="bSample">Sample</button>
 <button class="btn pri" id="bZip">Export ZIP</button>
</header>
<div class="main">
 <nav class="rail" id="rail" role="tablist" aria-label="Steps"></nav>
 <aside class="panel" id="panel"></aside>
 <section class="stage">
  <div class="vp" id="vp">
   <canvas id="gl"></canvas>
   <div class="vt" id="vt">
    <div class="seg" id="vMode"><button data-v="2d">2D</button><button data-v="3d">3D</button></div>
    <div class="seg" id="vTiles"><button data-v="1">1×</button><button data-v="2">2×2</button><button data-v="3">3×3</button></div>
    <div class="seg" id="vCmp"><button data-v="1" title="Wipe between the source photo and the map">Compare</button></div>
    <details class="box3" id="box3" open><summary>View options</summary>
     <div class="seg" id="vShape" style="margin:4px 0 2px"><button data-v="0">Plane</button><button data-v="1">Sphere</button><button data-v="2">Tube</button></div>
     <div class="row"><label for="s3d">Displacement</label><output id="o3d"></output><input type="range" id="s3d" min="0" max="0.4" step="0.005"></div>
     <div class="row"><label for="s3t">Tiling</label><output id="o3t"></output><input type="range" id="s3t" min="1" max="5" step="1"></div>
     <label class="tg"><input type="checkbox" id="c3l"><span></span>Orbit light</label>
    </details>
   </div>
   <div class="crop" id="crop"><div class="cw" id="cw"><img id="cimg" alt="Source photo"><div class="cb" id="cb"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div><div class="clab" id="clab"></div></div>
   <div class="hud" id="hud"></div>
   <div class="busy" id="busy">Rendering…</div>
  </div>
  <div class="strip" id="strip"></div>
 </section>
</div>
</div>
<div class="drop" id="drop">Drop an image to load it</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="shc"><b id="shT"></b><p id="shP"></p><div class="shb"><button class="btn" id="shX">Close</button><button class="btn" id="shZ">Download ZIP</button><button class="btn pri" id="shS">Save to Files…</button></div></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let toastT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)};

/* ---------- state ---------- */
const D={size:2048,lock:1,seam:1,smode:0,fall:.22,vp:1,hb:.5,cells:3,srot:.25,ssoft:.35,seed:1,dl:.6,drad:5,ct:1,ex:1,sa:1,eq:[.5,.7,.9,1,.9,.7,.5],hct:1,hbi:0,hiv:0,
 nst:10,nrad:1,rsrc:1,rbase:.65,rct:.8,riv:1,nfmt:'gl',rfmt:'r',h16:1,ea:1,eh:1,en:1,er:1,disp:.08,rep:1,shape:1,anim:1};
let S=JSON.parse(JSON.stringify(D));
try{Object.assign(S,JSON.parse(localStorage.getItem('btoolz-mapx')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('btoolz-mapx',JSON.stringify(S))}catch(e){}};
let crop={x:0,y:0,w:1,h:1},img=null,srcCanvas=null,mean=[.5,.5,.5],avgL=.5,name='material';
const view={tab:'height',map:'height',mode:'3d',tiles:2,zoom:1,pan:[0,0],cmp:0,wipe:.5,yaw:.5,pitch:.35,dist:3.3,t:.8};

/* ---------- GL ---------- */
const cv=$('#gl');
const gl=cv.getContext('webgl2',{antialias:true,alpha:false,premultipliedAlpha:false});
if(!gl){$('#vp').innerHTML='<div class="err">This tool needs WebGL 2. Try a current Safari, Chrome or Firefox.</div>';return}
const F16=!!gl.getExtension('EXT_color_buffer_float');
const ANI=gl.getExtension('EXT_texture_filter_anisotropic');
const MAXT=Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE),8192);
const VS=`#version 300 es
layout(location=0) in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FH=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;float lum(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
`;
function shd(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x}
function prog(fs,vs=VS,smp=null){const p=gl.createProgram();gl.attachShader(p,shd(gl.VERTEX_SHADER,vs));gl.attachShader(p,shd(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));p.u={};p.smp=smp;return p}
const smp=gl.createSampler();
gl.samplerParameteri(smp,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.samplerParameteri(smp,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.samplerParameteri(smp,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.samplerParameteri(smp,gl.TEXTURE_WRAP_T,gl.REPEAT);
if(ANI)gl.samplerParameterf(smp,ANI.TEXTURE_MAX_ANISOTROPY_EXT,8);
const smpMir=gl.createSampler();
gl.samplerParameteri(smpMir,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.samplerParameteri(smpMir,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.samplerParameteri(smpMir,gl.TEXTURE_WRAP_S,gl.MIRRORED_REPEAT);gl.samplerParameteri(smpMir,gl.TEXTURE_WRAP_T,gl.MIRRORED_REPEAT);
const P={
crop:prog(FH+`uniform sampler2D src;uniform vec4 r;void main(){vec2 s=vec2(r.x+uv.x*r.z,1.-(r.y+(1.-uv.y)*r.w));o=vec4(texture(src,s).rgb,1.);}`),
copy:prog(FH+`uniform sampler2D t;void main(){o=texture(t,uv);}`),
seam:prog(FH+`uniform sampler2D t;uniform vec2 dir;uniform float fall,vp,hb;uniform vec3 mean;
void main(){float c=dot(uv,dir),d=min(c,1.-c),w=1.-smoothstep(0.,fall,d);
vec3 a=texture(t,uv).rgb,b=texture(t,uv+dir*.5).rgb;w=clamp(w+(lum(b)-lum(a))*hb*16.*w*(1.-w),0.,1.);vec3 m=mix(a,b,w);
float k=inversesqrt(max(w*w+(1.-w)*(1.-w),.25));m=mix(m,mean+(m-mean)*k,vp);o=vec4(clamp(m,0.,1.),1.);}`),
scat:prog(FH+`uniform sampler2D t;uniform vec2 nc;uniform float rot,kk,hb,vp,seed,asp,mg;uniform vec3 mean;
vec2 h2(vec2 c){c=mod(c,nc);return fract(sin(vec2(dot(c,vec2(127.1,311.7)),dot(c,vec2(269.5,183.3)))+seed)*43758.5453);}
float h1(vec2 c){c=mod(c,nc);return fract(sin(dot(c,vec2(419.2,371.9))+seed*1.37)*24634.6345);}
void main(){vec2 P=uv*nc,ci=floor(P);vec3 acc=vec3(0);float ws=0.,w2=0.,ml=lum(mean);
for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 cj=ci+vec2(x,y),dd=P-(cj+.1+.8*h2(cj));float d=length(dd),a=(h1(cj)-.5)*6.2831853*rot;
 vec2 off=dd/nc*vec2(asp,1.);off=mat2(cos(a),sin(a),-sin(a),cos(a))*off/vec2(asp,1.);
 vec2 cs=mg+fract(h2(cj)*7.31+h1(cj)*3.17)*(1.-2.*mg);vec3 s=texture(t,cs+off).rgb;
 float w=exp(-kk*d+hb*12.*(lum(s)-ml));acc+=s*w;ws+=w;w2+=w*w;}
vec3 m=acc/ws;float k=inversesqrt(max(w2/(ws*ws),.25));m=mix(m,mean+(m-mean)*k,vp);o=vec4(clamp(m,0.,1.),1.);}`,VS,smpMir),
blur:prog(FH+`uniform sampler2D t;uniform vec2 st,hp;uniform float sg,cl;

 if(key==='height'&&S.h16&&'CompressionStream' in window){const u=new Uint16Array(W*H);
  readRows(t,(y0,n,b)=>{for(let r=0;r<n;r++){const dst=(H-1-(y0+r))*W,src=r*W*4;for(let x=0;x<W;x++)u[dst+x]=Math.round(clamp(b[src+x*4]*sc,0,1)*65535)}});return png16(W,H,u)}
 const c=document.createElement('canvas');c.width=W;c.height=H;const cx=c.getContext('2d'),id=cx.createImageData(W,H),d=id.data;
 const dx=key==='normal'&&S.nfmt==='dx',sm=key==='rough'&&S.rfmt==='s',gray=key==='height'||key==='rough';
 readRows(t,(y0,n,b)=>{for(let r=0;r<n;r++){const dst=(H-1-(y0+r))*W*4,src=r*W*4;for(let x=0;x<W*4;x+=4){
  let R_=b[src+x]*sc,G_=b[src+x+1]*sc,B_=b[src+x+2]*sc;if(gray){if(sm)R_=1-R_;G_=B_=R_}if(dx)G_=1-G_;
  d[dst+x]=R_*255;d[dst+x+1]=G_*255;d[dst+x+2]=B_*255;d[dst+x+3]=255}}});
 cx.putImageData(id,0,0);return new Promise(r=>c.toBlob(r,'image/png'))}
async function zip(files){const parts=[],cent=[];let off=0;
 for(const f of files){const d=new Uint8Array(await f.blob.arrayBuffer()),crc=crc32(d),nm=new TextEncoder().encode(f.name);
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(12,33,true);lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nm.length,true);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(14,33,true);ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  parts.push(lh.buffer,nm,d);cent.push(ch.buffer,nm);off+=30+nm.length+d.length}
 const cs=cent.reduce((s,p)=>s+p.byteLength,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
 return new Blob([...parts,...cent,end.buffer],{type:'application/zip'})}
const dlP=(async()=>{try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){return null}})();
const anchor=(fn,blob)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)};
let ready=[];const sheet=$('#sheet');
async function deliver(files){const dl=await dlP;
 if(dl){const f=files.length===1?files[0]:{name:`${name}_maps.zip`,blob:await zip(files)};
  try{await dl.save({filename:f.name,data:f.blob});toast('Saved '+f.name)}catch(e){toast(e&&e.code==='declined'?'Download cancelled':'Could not save: '+(e&&(e.message||e.code)))}return}
 ready=files;const mb=files.reduce((s,f)=>s+f.blob.size,0)/1048576;
 $('#shT').textContent=files.length===1?files[0].name:`${files.length} maps ready`;$('#shP').textContent=`${files.map(f=>f.name.replace(name+'_','')).join(', ')} · ${mb.toFixed(1)} MB`;
 const fl=files.map(f=>new File([f.blob],f.name,{type:'image/png'}));$('#shS').hidden=!(navigator.canShare&&navigator.canShare({files:fl}));$('#shS').onclick=async()=>{try{await navigator.share({files:fl})}catch(e){if(e.name!=='AbortError')toast('Sharing failed, try Download')}};
 $('#shZ').textContent=files.length===1?'Download':'Download ZIP';$('#shZ').classList.toggle('pri',$('#shS').hidden);sheet.classList.add('on')}
$('#shX').onclick=()=>sheet.classList.remove('on');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('on')};
$('#shZ').onclick=async()=>{if(ready.length===1)anchor(ready[0].name,ready[0].blob);else anchor(`${name}_maps.zip`,await zip(ready))};
const LABEL={albedo:'Albedo',height:'Height',normal:'Normal',rough:'Roughness'};
const fname=k=>`${name}_${k==='normal'?'Normal_'+(S.nfmt==='dx'?'DX':'GL'):k==='rough'&&S.rfmt==='s'?'Smoothness':LABEL[k]}.png`;
let exporting=false;
async function exportMaps(keys){if(!img||exporting)return;if(!keys.length)return toast('Tick at least one map');exporting=true;
 const o=outDims(),busy=$('#busy');busy.textContent=`Rendering ${o.W}×${o.H}…`;busy.classList.add('on');['#bZip','#bZip2'].forEach(s=>$(s).disabled=true);
 await new Promise(r=>setTimeout(r,40));const c=mkCtx(o.W,o.H,true),files=[],want=new Set(keys);
 try{stCrop(c);stTile(c);c.free('base');c.free('sx');stBlur(c);stHeight(c);c.free('hraw');stAlbedo(c);for(let i=1;i<=7;i++){c.free('L'+i);c.free('bt'+i)}
  if(want.has('albedo'))files.push({k:'albedo',blob:await encode(c.t.albedo,'albedo')});
  if(want.has('rough')){stRough(c);files.push({k:'rough',blob:await encode(c.t.rough,'rough')});c.free('rough')}
  c.free('albedo');c.free('tiled');
  if(want.has('normal')){stNormal(c);files.push({k:'normal',blob:await encode(c.t.normal,'normal')});c.free('normal')}
  if(want.has('height'))files.push({k:'height',blob:await encode(c.t.height,'height')});
 }catch(e){console.error(e);toast('Export failed: '+e.message)}
 finally{c.destroy();busy.classList.remove('on');['#bZip','#bZip2'].forEach(s=>$(s).disabled=false);exporting=false;redraw()}
 files.forEach(f=>f.name=fname(f.k));if(files.length)await deliver(files)}
const zipAll=()=>exportMaps([['ea','albedo'],['eh','height'],['en','normal'],['er','rough']].filter(([k])=>S[k]).map(x=>x[1]));
$('#bZip').onclick=zipAll;$('#bZip2').onclick=zipAll;
